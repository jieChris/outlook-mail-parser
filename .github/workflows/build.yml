name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name "邮箱验证码解析" `
            --add-data "outlook邮箱管理.html;." `
            --console `
            server.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item "dist/邮箱验证码解析.exe" "release/"
          Copy-Item "README.txt" "release/"
          Compress-Archive -Path release/* -DestinationPath "邮箱验证码解析-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 邮箱验证码解析-Windows
          path: 邮箱验证码解析-Windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 邮箱验证码解析-Windows.zip
          generate_release_notes: true
